org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# The app's identity, in one place. The name is what people see; the id is permanent once on a store (Android
# application id, iOS bundle id); the package is the root of the Kotlin code; the locale is the language of the
# untranslated texts. scripts/make-it-yours.sh sets them.
app.name=App Template
app.id=app.template
app.package=app.template
app.locale=en-US

# iOS targets build only on macOS; elsewhere they are skipped without a warning.
kotlin.native.ignoreDisabledTargets=true

# Where the machinery's Gradle plugins are published (its GitHub Pages). To build with a local copy of the machinery
# instead, set machinery.local=../app-machinery (here or in ~/.gradle/gradle.properties).
machinery.repository=https://ldeluigi.github.io/app-machinery/maven
