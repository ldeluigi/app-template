name: Automation

# Everything else that looks after the app (app-machinery's automation.yml): pull request titles and auto-merge, a retry
# and then the CI-fix agent after a failed run, the issue agent, the upgrade agent after a major update, the Monday retry
# of issues that waited for credit, the monthly refresh with its review, and the "Automation health" issue.
# "Run workflow" starts the refresh, or the retry of the issues, at once.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, closed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  issues:
    types: [opened, labeled, unlabeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: "30 8 * * 1"
    - cron: "41 4 1 * *"
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        options: [refresh, retry-issues]

permissions:
  contents: read

jobs:
  automation:
    permissions:
      actions: write
      checks: read
      contents: read
      issues: write
      pull-requests: read
    uses: ldeluigi/app-machinery/.github/workflows/automation.yml@86d0a3acd6fb5813770e0477297cc09d36a7ace3 # v1.4.0
    secrets: inherit
    with:
      task: ${{ inputs.task }}
