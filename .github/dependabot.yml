# Weekly dependency updates, merged by themselves once CI is green (automation.yml). Commit prefixes decide releases:
# Gradle updates (the app's libraries and the machinery's plugins) ship as patch releases (fix); the workflows' (the
# machinery's reusable workflows and the actions) don't (ci).
version: 2
# The machinery's Gradle plugins are published on its GitHub Pages
registries:
  machinery:
    type: maven-repository
    url: https://ldeluigi.github.io/app-machinery/maven
updates:
  - package-ecosystem: gradle
    directory: /
    registries: "*"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: fix
      include: scope
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Etc/UTC
    # Dependabot takes only default-days for actions: the semver-*-days keys make it refuse the whole file.
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
