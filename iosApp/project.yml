# The iOS app around the shared Kotlin code, as XcodeGen builds the Xcode project from it (`xcodegen generate`).
# Its name, bundle id, version and languages come from Gradle (Configuration/Generated.xcconfig, App/Info.plist),
# written by `./gradlew :composeApp:iosProjectFiles`, which XcodeGen runs first.
name: App
options:
  deploymentTarget:
    iOS: "16.0"
  preGenCommand: cd .. && ./gradlew --quiet :composeApp:iosProjectFiles
  # Languages come from the shared Compose resources, not from Xcode's strings files.
  developmentLanguage: en
configFiles:
  Debug: Configuration/Generated.xcconfig
  Release: Configuration/Generated.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist"]
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        PRODUCT_NAME: App
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: -framework ComposeApp
    preBuildScripts:
      - name: Compile the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: App
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
schemes:
  App:
    build:
      targets:
        App: all
        AppUITests: [test]
    test:
      targets: [AppUITests]
