# The app's own libraries. Kotlin, the Android Gradle plugin, Compose Multiplatform, the SDK levels, the test libraries
# and the static analysis come with the machinery's plugins, at the machinery version below: one Dependabot pull request
# moves them all, tested together.

[versions]
machinery = "1.1.0"
activity-compose = "1.13.0"
navigation-compose = "2.10.0"
lifecycle = "2.11.0"
kotlinx-coroutines = "1.11.0"
kotlinx-io = "0.9.2"
aboutlibraries = "15.3.0"
compose-bom = "2026.09.00"
play-app-update = "2.1.0"
androidx-test-ext = "1.3.0"
androidx-test-runner = "1.7.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
jetbrains-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
jetbrains-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
aboutlibraries-compose-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutlibraries" }
play-app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "play-app-update" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

[plugins]
machinery-kmp-library = { id = "machinery.kmp-library", version.ref = "machinery" }
machinery-compose-library = { id = "machinery.compose-library", version.ref = "machinery" }
machinery-android-application = { id = "machinery.android-application", version.ref = "machinery" }
machinery-serialization = { id = "machinery.serialization", version.ref = "machinery" }
